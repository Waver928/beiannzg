      <div class="page-head"><div><h1>品种推荐规则</h1><p>结合生产目标与约束排除不满足熟期、抗性或区域要求的品种。</p></div><div class="actions"><button class="btn primary" data-action="simulate-recommend">运行规则模拟</button></div></div>
      
<div class="grid-2">
 <section class="card"><div class="card-head"><div><div class="card-title">推荐条件</div><div class="card-sub">北岗1号地 · 大豆</div></div></div><div class="card-body"><div class="form-grid"><div class="form-item"><label>生产目标</label><select><option>稳产抗逆</option><option>高产潜力</option><option>高蛋白</option></select></div><div class="form-item"><label>目标产量</label><input value="210 kg/亩"></div><div class="form-item"><label>最大需积温</label><input value="2,135℃"></div><div class="form-item"><label>最低抗倒伏等级</label><select><option>强</option><option>中强</option></select></div><div class="form-item full"><label>区域要求</label><select><option>必须通过黑龙江第四积温带审定</option></select></div></div></div></section>
 <section class="card"><div class="card-head"><div><div class="card-title">规则执行预览</div><div class="card-sub">326 个品种逐级过滤</div></div></div><div class="card-body"><div class="timeline"><div class="timeline-item"><b>作物类型过滤</b><p>保留大豆品种 148 个</p></div><div class="timeline-item"><b>熟期与积温过滤</b><p>保留 62 个</p></div><div class="timeline-item"><b>区域审定过滤</b><p>保留 28 个</p></div><div class="timeline-item"><b>抗性与生产目标过滤</b><p>形成候选品种 15 个</p></div></div></div></section>
